<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-nnect Bottle-to-WiFi Vendo</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #e8f5e9;
            --accent-blue: #0288d1;
            --dark-text: #1b5e20;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-green);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .vendo-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.15);
            max-width: 400px;
            width: 100%;
            padding: 30px;
            text-align: center;
            border: 2px solid #c8e6c9;
        }

        .header h1 {
            color: var(--primary-green);
            font-size: 24px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        .eco-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .status-display {
            background-color: var(--light-green);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px dashed var(--primary-green);
        }

        .counter-label {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--dark-text);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .counter-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary-green);
            margin: 5px 0;
        }

        .conversion-rate {
            font-size: 13px;
            color: #555;
        }

        .btn-insert {
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-insert:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(46, 125, 50, 0.4);
        }

        .btn-insert:active {
            transform: translateY(0);
        }

        .info-footer {
            margin-top: 25px;
            font-size: 11px;
            color: #888;
            line-height: 1.4;
        }

        .accent-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="vendo-card">
        <div class="header">
            <div class="eco-icon">🌱</div>
            <h1>Eco-nnect</h1>
            <p>Bottle-to-WiFi Smart Vendo</p>
        </div>

        <div class="status-display">
            <div class="counter-label">Bottles Inserted</div>
            <!-- This number updates dynamically in the real firmware -->
            <div class="counter-value" id="bottle-count">0</div>
            <div class="conversion-rate">1 Plastic Bottle = <b>30 Mins WiFi</b></div>
        </div>

        <!-- This simulates the action when the portal triggers a coin/hardware signal -->
        <button class="btn-insert" onclick="simulateBottleDrop()">Drop Bottle Now</button>

        <div class="info-footer">
            <p>Help clean the environment & get connected.<br>Powered by your custom Arduino Firmware.</p>
        </div>
    </div>

    <script>
        // Simple preview logic: increases the bottle count on click
        let count = 0;
        function simulateBottleDrop() {
            count++;
            document.getElementById('bottle-count').innerText = count;
        }
    </script>

</body>
</html>
